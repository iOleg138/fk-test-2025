<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Олимпиада по физкультуре 5-6 класс — тренировка</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 16px;
    color: #1a202c;
    line-height: 1.5;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header {
    background: #2b6cb0;
    color: white;
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 16px;
    text-align: center;
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; font-size: 13px; opacity: 0.9; }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .toolbar button {
    flex: 1;
    min-width: 140px;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-primary { background: #2b6cb0; color: white; }
  .btn-primary:hover { background: #2c5282; }
  .btn-secondary { background: #e2e8f0; color: #2d3748; }
  .btn-secondary:hover { background: #cbd5e0; }
  .btn-danger { background: #e53e3e; color: white; }
  .progress-bar {
    background: #e2e8f0;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-fill {
    background: #38a169;
    height: 100%;
    transition: width 0.3s;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #4a5568;
    margin-bottom: 8px;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .question-num {
    font-size: 12px;
    color: #718096;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #1a202c;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    padding: 12px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.15s;
    font-size: 15px;
    background: white;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .option:hover:not(.disabled) { border-color: #90cdf4; background: #ebf8ff; }
  .option.selected { border-color: #2b6cb0; background: #ebf8ff; }
  .option.correct { border-color: #38a169; background: #f0fff4; }
  .option.wrong { border-color: #e53e3e; background: #fff5f5; }
  .option.disabled { cursor: default; }
  .option .mark {
    font-weight: bold;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .explanation {
    margin-top: 14px;
    padding: 12px 14px;
    background: #f7fafc;
    border-left: 4px solid #2b6cb0;
    border-radius: 6px;
    font-size: 14px;
    color: #2d3748;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation.correct { border-left-color: #38a169; }
  .explanation.wrong { border-left-color: #e53e3e; }
  .actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .finish-screen { text-align: center; padding: 20px; }
  .finish-screen h2 { font-size: 22px; margin-bottom: 8px; }
  .score { font-size: 40px; font-weight: bold; color: #2b6cb0; margin: 12px 0; }
  .review { text-align: left; margin-top: 20px; }
  .review-item {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
    border-left: 4px solid #cbd5e0;
    background: #f7fafc;
  }
  .review-item.wrong { border-left-color: #e53e3e; background: #fff5f5; }
  .review-item.correct { border-left-color: #38a169; background: #f0fff4; }
  .review-item .q { font-weight: 600; margin-bottom: 4px; }
  .review-item .a { color: #4a5568; }
  .review-item .a.correct-answer { color: #38a169; font-weight: 600; }
  .hidden { display: none; }
  @media (max-width: 500px) {
    .question-text { font-size: 16px; }
    .option { font-size: 14px; padding: 10px 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏃 Олимпиада по физкультуре</h1>
    <p>5–6 класс · теория · Санкт-Петербург 2025–2026</p>
  </header>

  <div class="toolbar">
    <button id="modeLearn" class="btn-primary">📚 Режим обучения</button>
    <button id="modeExam" class="btn-secondary">📝 Режим экзамена</button>
    <button id="shuffleBtn" class="btn-secondary">🔀 Перемешать вопросы</button>
    <button id="resetBtn" class="btn-danger">🔄 Сброс</button>
  </div>

  <div class="stats">
    <span id="progressText">Вопрос 1 из 95</span>
    <span id="scoreText">Верно: 0 · Ошибок: 0</span>
  </div>
  <div class="progress-bar"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>

  <div id="quizContainer" class="card">
    <div id="questionNum" class="question-num"></div>
    <div id="questionText" class="question-text"></div>
    <div id="options" class="options"></div>
    <div id="explanation" class="explanation"></div>
    <div class="actions">
      <button id="nextBtn" class="btn-primary hidden">Следующий вопрос →</button>
      <button id="finishBtn" class="btn-primary hidden">Завершить и показать результат</button>
    </div>
  </div>

  <div id="finishScreen" class="card finish-screen hidden">
    <h2>Результат</h2>
    <div id="finalScore" class="score">0 / 95</div>
    <div id="finalComment"></div>
    <div class="actions" style="justify-content:center;">
      <button id="restartBtn" class="btn-primary">Пройти заново</button>
    </div>
    <div id="review" class="review"></div>
  </div>
</div>

<script>
// ==================== ВОПРОСЫ ====================
// correct — правильный ответ. ex — пояснение (по желанию).
const QUESTIONS = [
  { q: "Дистанция в одну стадию на античных Олимпийских играх составляла…", o: ["100 метров", "192 метра 27 сантиметров", "200 метров", "42 километра 195 метров"], correct: "192 метра 27 сантиметров", ex: "Один стадий ≈ 192 м 27 см. Отсюда слово «стадион»." },
  { q: "Как называлась беговая дорожка в древнегреческом стадионе, длина которой равнялась одной стадии?", o: ["Ипподром", "Палестра", "Стадиодром", "Гимнасий"], correct: "Стадиодром", ex: "Стадиодром — беговая дорожка длиной в один стадий." },
  { q: "Чему примерно равнялась дистанция «долихос» (длинный бег) на античных Играх?", o: ["1 стадий", "От 7 до 24 стадиев", "100 метров", "42 километра"], correct: "От 7 до 24 стадиев", ex: "Долихос — от 7 до 24 стадиев, в зависимости от Игр." },
  { q: "Кто, согласно легенде, отмерил дистанцию в одну стадию в Олимпии своими ступнями?", o: ["Зевс", "Геракл", "Ахиллес", "Гермес"], correct: "Геракл", ex: "По легенде, Геракл отмерил стадий 600 ступнями." },
  { q: "Какое современное слово произошло от древнегреческой меры длины «стадий»?", o: ["Стадион", "Статуя", "Станция", "Степень"], correct: "Стадион" },

  { q: "В каком году состоялись первые известные нам Олимпийские игры в Древней Греции?", o: ["756 г. до н. э.", "766 г. до н. э.", "776 г. до н. э.", "786 г. до н. э."], correct: "776 г. до н. э.", ex: "776 год до н. э. — общепринятая дата начала античных Игр." },
  { q: "Имя первого победителя античных Олимпийских игр, повара из Элиды?", o: ["Короибос", "Милон", "Леонидас", "Полидам"], correct: "Короибос" },
  { q: "Какому богу были посвящены Олимпийские игры в Древней Греции?", o: ["Посейдону", "Зевсу", "Аполлону", "Аресу"], correct: "Зевсу" },
  { q: "Что объявлялось в Древней Греции на время проведения Олимпийских игр?", o: ["Начало сбора налогов", "Священное перемирие", "Набор в армию", "Запрет на торговлю"], correct: "Священное перемирие", ex: "Экехейрия — священное перемирие на время Игр." },
  { q: "В каком городе-государстве проводились античные Олимпийские игры?", o: ["Афины", "Спарта", "Олимпия", "Коринф"], correct: "Олимпия" },

  { q: "Какой вид физических упражнений не входил в программу пентатлона?", o: ["Бег", "Метание диска", "Борьба", "Прыжки в высоту"], correct: "Прыжки в высоту", ex: "В пентатлон входили: бег, прыжки в длину, метание диска, метание копья, борьба." },
  { q: "Из скольких видов состоял пентатлон в Древней Греции?", o: ["Трех", "Пяти", "Семи", "Десяти"], correct: "Пяти", ex: "Пентатлон — от греч. «пента» (пять) + «атлон» (соревнование)." },
  { q: "Как называлась борьба, входившая в программу античного пентатлона?", o: ["Панкратион", "Пале", "Дзюдо", "Самбо"], correct: "Пале" },
  { q: "Какое оружие использовали атлеты в беге с оружием на античных Играх?", o: ["Меч", "Копье", "Щит и шлем", "Лук и стрелы"], correct: "Щит и шлем" },
  { q: "Какой снаряд для метания в Древней Греции имел форму линзы и часто изготавливался из камня или бронзы?", o: ["Копье", "Диск", "Ядро", "Молот"], correct: "Диск" },

  { q: "Официальными талисманами Зимних Олимпийских игр 2014 года были", o: ["Бурый медведь, леопард, заяц", "Белый медведь, леопард, заяц", "Белый медведь, амурский тигр, заяц", "Волк, лиса, заяц"], correct: "Белый медведь, леопард, заяц" },
  { q: "В каком российском городе проходили Зимние Олимпийские игры 2014 года?", o: ["Казань", "Москва", "Сочи", "Красноярск"], correct: "Сочи" },
  { q: "Какое животное было талисманом Зимних Паралимпийских игр 2014 года?", o: ["Лучик и Снежинка", "Белый медведь", "Заяц", "Леопард"], correct: "Лучик и Снежинка" },
  { q: "Какой талисман Олимпиады-1980 в Москве стал одним из самых узнаваемых в истории Игр?", o: ["Панда", "Кенгуру", "Медвежонок Миша", "Тигренок Ходори"], correct: "Медвежонок Миша" },
  { q: "Как звали леопарда-талисмана Сочи-2014?", o: ["Барсик", "Лео", "Снежок", "Горыныч"], correct: "Барсик" },

  { q: "Первые Олимпийские игры современности проходили в 1896 году в:", o: ["Париже", "Берлине", "Лондоне", "Афинах"], correct: "Афинах" },
  { q: "Кто был инициатором возрождения Олимпийских игр в конце XIX века?", o: ["Хуан Антонио Самаранч", "Пьер де Кубертен", "Томас Бах", "Дзигоро Кано"], correct: "Пьер де Кубертен" },
  { q: "Какая страна стала первой в неофициальном медальном зачете на Играх 1896 года?", o: ["Франция", "США", "Греция", "Великобритания"], correct: "Греция" },
  { q: "На каком стадионе проходили соревнования по легкой атлетике на Играх 1896 года?", o: ["Колизей", "Панатинаикос", "Уэмбли", "Лужники"], correct: "Панатинаикос" },
  { q: "Спортсмены скольких стран приняли участие в Первых Олимпийских играх современности?", o: ["5", "14", "34", "100"], correct: "14" },

  { q: "Привычная поза человека в положении стоя, сидя и во время ходьбы называется…", o: ["Осанка", "Равновесие", "Экстерьер", "Выправка"], correct: "Осанка" },
  { q: "Как называется искривление позвоночника вбок, которое может возникнуть при неправильной осанке?", o: ["Лордоз", "Кифоз", "Сколиоз", "Остеохондроз"], correct: "Сколиоз" },
  { q: "Какое упражнение лучше всего помогает формировать правильную осанку?", o: ["Приседания", "Подтягивания", "Упражнения у стены", "Бег с ускорениями"], correct: "Упражнения у стены" },
  { q: "Что из перечисленного может испортить осанку школьника?", o: ["Занятия плаванием", "Ношение портфеля в одной руке", "Сон на жесткой кровати", "Утренняя гимнастика"], correct: "Ношение портфеля в одной руке" },
  { q: "Какой врач занимается лечением нарушений осанки и искривлений позвоночника?", o: ["Окулист", "Хирург", "Ортопед", "Терапевт"], correct: "Ортопед" },

  { q: "Способность выполнять движения с большой амплитудой называется…", o: ["Сила", "Быстрота", "Гибкость", "Выносливость"], correct: "Гибкость" },
  { q: "Как называется комплекс упражнений, направленный на развитие гибкости и растяжку мышц?", o: ["Стретчинг", "Шейпинг", "Аэробика", "Кроссфит"], correct: "Стретчинг" },
  { q: "В каком виде спорта гибкость имеет решающее значение для результата?", o: ["Тяжелая атлетика", "Бег на 100 метров", "Художественная гимнастика", "Футбол"], correct: "Художественная гимнастика" },
  { q: "С какого теста в школе чаще всего оценивают гибкость позвоночника?", o: ["Подтягивание", "Бег 30 метров", "Наклон вперед из положения сидя", "Прыжок в длину"], correct: "Наклон вперед из положения сидя" },
  { q: "Что происходит с гибкостью человека при отсутствии регулярных тренировок?", o: ["Улучшается", "Не изменяется", "Ухудшается", "Полностью исчезает"], correct: "Ухудшается" },

  { q: "Способность преодолевать внешнее сопротивление или противодействовать ему за счет мышечных усилий называется …", o: ["Сила", "Быстрота", "Гибкость", "Выносливость"], correct: "Сила" },

  { q: "Положение занимающегося, при котором согнутые в коленях ноги подтянуты руками к груди и кисти захватывают колени называется…", o: ["Кувырок", "Группировка", "Сед", "Вис"], correct: "Группировка" },

  { q: "Баскетбол впервые был включен в программу Олимпийских игр в 1936 году. В какой стране это произошло?", o: ["США", "Германия", "Греция", "Япония"], correct: "Германия" },

  { q: "Что такое «вторая ветвь» в беге на длинные дистанции?", o: ["Ускорение в конце", "Состояние, при котором организм адаптировался к нагрузке", "Боль в боку", "Остановка дыхания"], correct: "Состояние, при котором организм адаптировался к нагрузке" },
  { q: "Какой показатель пульса свидетельствует о том, что нагрузку нужно снизить?", o: ["100 уд/мин", "130 уд/мин", "180 уд/мин", "200 уд/мин"], correct: "180 уд/мин" },
  { q: "Что нужно сделать при появлении признаков сильного утомления на уроке физкультуры?", o: ["Продолжить выполнение", "Сообщить учителю и снизить нагрузку", "Ускориться", "Задержать дыхание"], correct: "Сообщить учителю и снизить нагрузку" },
  { q: "Как называется способность организма противостоять утомлению?", o: ["Сила", "Выносливость", "Гибкость", "Ловкость"], correct: "Выносливость" }
];

// ==================== ЛОГИКА ====================
let currentQuestions = [...QUESTIONS];
let currentIndex = 0;
let score = 0;
let wrong = 0;
let mode = 'learn'; // 'learn' или 'exam'
let answered = false;
let userAnswers = []; // для разбора в конце

const $ = id => document.getElementById(id);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuestion() {
  const q = currentQuestions[currentIndex];
  answered = false;
  $('questionNum').textContent = `Вопрос ${currentIndex + 1} из ${currentQuestions.length}`;
  $('questionText').textContent = q.q;
  $('explanation').className = 'explanation';
  $('explanation').textContent = '';
  $('nextBtn').classList.add('hidden');
  $('finishBtn').classList.add('hidden');
  $('progressText').textContent = `Вопрос ${currentIndex + 1} из ${currentQuestions.length}`;
  $('progressFill').style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

  const optionsEl = $('options');
  optionsEl.innerHTML = '';
  // перемешиваем варианты
  const opts = shuffle(q.o);
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="mark"></span><span>${opt}</span>`;
    btn.onclick = () => selectOption(btn, opt, q);
    optionsEl.appendChild(btn);
  });
}

function selectOption(btn, chosen, q) {
  if (answered) return;
  answered = true;

  const isCorrect = chosen === q.correct;
  const allOptions = document.querySelectorAll('.option');
  allOptions.forEach(o => {
    o.classList.add('disabled');
    o.onclick = null;
    const text = o.querySelector('span:last-child').textContent;
    if (text === q.correct) {
      o.classList.add('correct');
      o.querySelector('.mark').textContent = '✓';
    } else if (text === chosen && !isCorrect) {
      o.classList.add('wrong');
      o.querySelector('.mark').textContent = '✗';
    }
  });

  if (isCorrect) score++; else wrong++;

  userAnswers.push({
    question: q.q,
    chosen: chosen,
    correct: q.correct,
    isCorrect: isCorrect,
    ex: q.ex || ''
  });

  // Показываем объяснение и правильный ответ ТОЛЬКО в режиме обучения
  if (mode === 'learn') {
    const exp = $('explanation');
    exp.classList.add('show');
    exp.classList.add(isCorrect ? 'correct' : 'wrong');
    let text = isCorrect ? '✅ Верно! ' : `❌ Неверно. Правильный ответ: ${q.correct}. `;
    if (q.ex) text += q.ex;
    exp.textContent = text;
  }

  $('scoreText').textContent = `Верно: ${score} · Ошибок: ${wrong}`;

  if (currentIndex < currentQuestions.length - 1) {
    $('nextBtn').classList.remove('hidden');
  } else {
    $('finishBtn').classList.remove('hidden');
  }
}

function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  }
}

function finishQuiz() {
  $('quizContainer').classList.add('hidden');
  $('finishScreen').classList.remove('hidden');
  const total = currentQuestions.length;
  const percent = Math.round((score / total) * 100);
  $('finalScore').textContent = `${score} / ${total} (${percent}%)`;
  let comment = '';
  if (percent >= 90) comment = '🏆 Отлично! Ты готов к олимпиаде!';
  else if (percent >= 75) comment = '👍 Хорошо! Повтори сложные темы.';
  else if (percent >= 50) comment = '📚 Нормально, но стоит повторить материал.';
  else comment = '💪 Нужно ещё потренироваться. Попробуй режим обучения!';
  $('finalComment').textContent = comment;

  // разбор ошибок
  const reviewEl = $('review');
  if (mode === 'exam') {
    const mistakes = userAnswers.filter(a => !a.isCorrect);
    if (mistakes.length === 0) {
      reviewEl.innerHTML = '<p style="text-align:center;color:#38a169;font-weight:600;">Все ответы верные! 🎉</p>';
    } else {
      reviewEl.innerHTML = '<h3 style="margin-top:20px;">Разбор ошибок:</h3>' +
        mistakes.map(m => `
          <div class="review-item wrong">
            <div class="q">${m.question}</div>
            <div class="a">Твой ответ: <span style="color:#e53e3e;">${m.chosen}</span></div>
            <div class="a correct-answer">Правильно: ${m.correct}</div>
            ${m.ex ? `<div class="a" style="margin-top:4px;font-size:13px;">${m.ex}</div>` : ''}
          </div>
        `).join('');
    }
  } else {
    reviewEl.innerHTML = '';
  }
}

function resetQuiz() {
  currentIndex = 0;
  score = 0;
  wrong = 0;
  userAnswers = [];
  $('quizContainer').classList.remove('hidden');
  $('finishScreen').classList.add('hidden');
  renderQuestion();
  $('scoreText').textContent = 'Верно: 0 · Ошибок: 0';
}

// ==================== СОБЫТИЯ ====================
$('nextBtn').onclick = nextQuestion;
$('finishBtn').onclick = finishQuiz;
$('restartBtn').onclick = resetQuiz;
$('resetBtn').onclick = resetQuiz;

$('modeLearn').onclick = () => {
  mode = 'learn';
  $('modeLearn').className = 'btn-primary';
  $('modeExam').className = 'btn-secondary';
  resetQuiz();
};

$('modeExam').onclick = () => {
  mode = 'exam';
  $('modeExam').className = 'btn-primary';
  $('modeLearn').className = 'btn-secondary';
  resetQuiz();
};

$('shuffleBtn').onclick = () => {
  currentQuestions = shuffle(QUESTIONS);
  resetQuiz();
};

// старт
renderQuestion();
</script>
